[project]
name = "ai-learning-assistant"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "langchain",
    "langgraph",
    "langchain-openai",
    "python-dotenv"
]


[build-system]

requires = [
    "setuptools"
]

build-backend = "setuptools.build_meta"


[tool.setuptools]

package-dir = {"" = "src"}