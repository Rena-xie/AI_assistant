<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Learning Assistant</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css"
    />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>会话</h2>
          <button id="new-conversation-btn" type="button">新建对话</button>
        </div>
        <div id="conversation-list" class="conversation-list"></div>
      </aside>

      <section class="main-panel">
        <header class="topbar">
          <h1>AI Learning Assistant</h1>
        </header>

        <main class="chat-panel" id="chat-panel" aria-live="polite"></main>

        <form class="composer" id="chat-form">
          <input
            id="message-input"
            type="text"
            placeholder="输入问题..."
            autocomplete="off"
            aria-label="Message input"
          />
          <button id="send-button" type="submit">发送</button>
        </form>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
